name: Windows Release Gate

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-test-install:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install release tooling
        shell: pwsh
        run: |
          choco install innosetup --version 6.7.1 -y --no-progress --limit-output
          if ($LASTEXITCODE -notin @(0,1641,3010)) { exit $LASTEXITCODE }

      - name: Run static source checks
        shell: pwsh
        run: python scripts/static-source-checks.py

      - name: Build, stage engines, self-test and compile Setup.exe
        shell: pwsh
        run: ./scripts/publish-release.ps1

      - name: Install exact Setup.exe and test installed copy
        shell: pwsh
        run: |
          ./scripts/verify-installed-release.ps1 `
            -InstallerPath './dist/installer/PDF Rescue Setup.exe' `
            -SamplePdf './dist/release-sample.pdf'

      - name: Upload PDF Rescue Setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Rescue-Windows-Installer
          path: dist/installer/PDF Rescue Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Rescue-Release-Evidence
          path: |
            dist/selftest-preinstall/**
            dist/selftest-installed/**
            dist/release-sample.pdf
          if-no-files-found: warn
          retention-days: 14
