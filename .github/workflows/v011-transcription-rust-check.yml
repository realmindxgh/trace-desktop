name: Trace v0.11 transcription native Windows check

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/v011-transcription-rust-check.yml'
      - 'ci/reconstruct_v011.ps1'
      - 'bootstrap/v011transcribe/**'

permissions:
  contents: write

concurrency:
  group: trace-v011-transcription-native
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish native run ID
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build-status | Out-Null
          @"
          run_id=${{ github.run_id }}
          run_number=${{ github.run_number }}
          source_sha=${{ github.sha }}
          result=running
          workflow=Trace v0.11 transcription native Windows check
          "@ | Set-Content build-status/v011-transcription-native.txt
          git config user.name 'trace-build-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add build-status/v011-transcription-native.txt
          git commit -m 'ci: record v0.11 native transcription run [skip ci]'
          if ($LASTEXITCODE -ne 0) { throw 'Could not commit native transcription run ID.' }
          git pull --rebase origin main
          if ($LASTEXITCODE -ne 0) { throw 'Could not rebase native transcription run ID.' }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish native transcription run ID.' }

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Reconstruct verified v0.11 transcription source
        shell: pwsh
        run: |
          & ./ci/reconstruct_v011.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Trace v0.11 PowerShell reconstruction failed.' }

      - name: Prepare Windows assets
        working-directory: work
        shell: pwsh
        run: |
          python -m pip install pillow
          if ($LASTEXITCODE -ne 0) { throw 'Could not install Pillow.' }
          python scripts/ci_prepare_assets.py
          if ($LASTEXITCODE -ne 0) { throw 'Trace Windows asset generation failed.' }
          Copy-Item src-tauri/windows/installer-header.bmp src-tauri/windows/trace-installer-header.bmp -Force
          Copy-Item src-tauri/windows/installer-sidebar.bmp src-tauri/windows/trace-installer-sidebar.bmp -Force
          New-Item -ItemType Directory -Force -Path setup-shell/src-tauri/icons | Out-Null
          Copy-Item src-tauri/icons/icon.ico setup-shell/src-tauri/icons/icon.ico -Force

      - name: Regression and transcription contracts
        working-directory: work
        shell: pwsh
        run: |
          node --check src/app.js
          if ($LASTEXITCODE -ne 0) { throw 'Trace JavaScript syntax failed.' }
          python tests/schema_contract.py
          if ($LASTEXITCODE -ne 0) { throw 'Trace schema contract failed.' }
          $compat='tests/v10_compat.py'
          (Get-Content tests/v10_functional.py -Raw).Replace("'0.10.0'","'0.11.0'") | Set-Content $compat
          python $compat
          $compatExit=$LASTEXITCODE
          Remove-Item $compat -Force
          if ($compatExit -ne 0) { throw 'Trace v0.10 regression contract failed under v0.11.' }
          python tests/v11_imports_display.py
          if ($LASTEXITCODE -ne 0) { throw 'Trace v0.11 import/display contract failed.' }
          python tests/v11_usability.py
          if ($LASTEXITCODE -ne 0) { throw 'Trace v0.11 usability contract failed.' }
          python tests/v11_transcription.py
          if ($LASTEXITCODE -ne 0) { throw 'Trace v0.11 transcription contract failed.' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Trace frontend build failed.' }

      - name: Generate native Windows bindings and compile
        working-directory: work
        shell: pwsh
        run: |
          if ($env:WHISPER_DONT_GENERATE_BINDINGS) { Remove-Item Env:WHISPER_DONT_GENERATE_BINDINGS }
          cargo check --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Trace transcription native Windows compile failed.' }
          cargo test --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Trace transcription native Windows tests failed.' }

      - name: Upload green reconstructed source
        uses: actions/upload-artifact@v4
        with:
          name: Trace-v0.11-Transcription-Native-Green-Source
          if-no-files-found: error
          retention-days: 14
          path: |
            work/package.json
            work/src/**
            work/database/**
            work/src-tauri/Cargo.toml
            work/src-tauri/tauri.conf.json
            work/src-tauri/src/**
            work/setup-shell/package.json
            work/setup-shell/src/**
            work/setup-shell/src-tauri/Cargo.toml
            work/setup-shell/src-tauri/tauri.conf.json
            work/setup-shell/src-tauri/src/**
            work/tests/**
