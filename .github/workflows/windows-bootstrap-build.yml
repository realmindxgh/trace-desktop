name: Trace Windows native build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'build-status/**'

permissions:
  contents: write

jobs:
  windows-native:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Reconstruct Trace source
        shell: pwsh
        run: |
          $parts = Get-ChildItem bootstrap/source.part* | Sort-Object Name
          if ($parts.Count -ne 9) { throw "Incomplete Trace source bootstrap. Expected 9 parts, found $($parts.Count)." }
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          if ($b64.Length -ne 116716) { throw "Trace bootstrap length mismatch: $($b64.Length)" }
          $archive = Join-Path $env:RUNNER_TEMP 'trace-source.tar.xz'
          [IO.File]::WriteAllBytes($archive, [Convert]::FromBase64String($b64))
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '0c02d66eb6d92f42904e2d561416f9ff945907a3fcbf6988526a4b8ae65fac3b') {
            throw "Trace bootstrap SHA-256 mismatch: $hash"
          }
          New-Item -ItemType Directory -Force -Path work | Out-Null
          python -c "import tarfile; tarfile.open(r'$archive', 'r:xz').extractall('work')"
          if (!(Test-Path work/src-tauri/Cargo.toml)) { throw 'Trace source reconstruction failed.' }
          if (Test-Path bootstrap/overrides) {
            Copy-Item bootstrap/overrides/* work -Recurse -Force
          }

      - name: Install Python test dependencies
        working-directory: work
        run: python -m pip install lxml pillow

      - name: Generate Trace brand and Windows assets
        working-directory: work
        run: |
          python scripts/generate_brand_assets.py
          python scripts/generate_windows_assets.py

      - name: Frontend syntax checks
        working-directory: work
        run: |
          node --check src/app.js
          node --check installer-ui/src/app.js
          node --check setup-shell/src/app.js

      - name: Core research-data contracts
        working-directory: work
        run: |
          python tests/schema_contract.py
          python tests/v06_features.py
          python tests/package_roundtrip.py
          python tests/v08_release.py
          python tests/v09_release.py

      - name: Public migration corpus
        working-directory: work
        run: |
          python tests/fetch_public_vendor_samples.py
          python tests/vendor_migration.py

      - name: REFI-QDA schema validation
        working-directory: work
        run: |
          python scripts/fetch_refi_project_schema.py
          python tests/refi_roundtrip.py

      - name: Install Tauri CLI
        working-directory: work
        run: npm install --save-dev @tauri-apps/cli@2.11.0

      - name: Build frontend
        working-directory: work
        run: npm run build

      - name: Rust compile check
        working-directory: work
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build Trace application and Windows installers
        working-directory: work
        run: npx tauri build

      - name: Stage NSIS payload for branded setup
        shell: pwsh
        run: |
          $payload = Get-ChildItem work/src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (!$payload) { throw 'Tauri NSIS payload not found.' }
          New-Item -ItemType Directory -Force -Path work/setup-shell/src-tauri/payload | Out-Null
          Copy-Item $payload.FullName work/setup-shell/src-tauri/payload/trace-payload.exe -Force
          $bytes = [IO.File]::ReadAllBytes('work/setup-shell/src-tauri/payload/trace-payload.exe')
          if ($bytes.Length -lt 1MB -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            throw 'Embedded installer payload is not a credible Windows executable.'
          }

      - name: Install setup-shell Tauri CLI
        working-directory: work/setup-shell
        run: npm install --save-dev @tauri-apps/cli@2.11.0

      - name: Build branded Trace setup frontend
        working-directory: work/setup-shell
        run: npm run build

      - name: Compile branded Trace setup shell
        working-directory: work/setup-shell
        run: |
          cargo check --manifest-path src-tauri/Cargo.toml
          cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: Assemble Windows release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path work/release | Out-Null
          $setup = 'work/setup-shell/src-tauri/target/release/trace-setup.exe'
          if (!(Test-Path $setup)) { throw 'Trace setup shell executable is missing.' }
          Copy-Item $setup work/release/TraceSetup.exe -Force
          $size = (Get-Item work/release/TraceSetup.exe).Length
          if ($size -lt 1MB) { throw "TraceSetup.exe is unexpectedly small: $size bytes" }
          Get-FileHash work/release/TraceSetup.exe -Algorithm SHA256 | Format-List | Out-File work/release/SHA256.txt
          Write-Host "TraceSetup.exe $size bytes"

      - name: Upload Windows release
        uses: actions/upload-artifact@v4
        with:
          name: Trace-Windows-Release
          if-no-files-found: error
          retention-days: 14
          path: |
            work/release/TraceSetup.exe
            work/release/SHA256.txt
            work/src-tauri/target/release/bundle/nsis/*.exe
            work/src-tauri/target/release/bundle/msi/*.msi

      - name: Publish build status
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build-status | Out-Null
          @"
          run_id=${{ github.run_id }}
          run_number=${{ github.run_number }}
          source_sha=${{ github.sha }}
          result=${{ job.status }}
          workflow=Trace Windows native build
          "@ | Set-Content build-status/windows-native.txt
          git config user.name 'trace-build-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add build-status/windows-native.txt
          if (git status --porcelain) {
            git commit -m 'ci: record Windows native build [skip ci]'
            git push origin HEAD:main
          }
