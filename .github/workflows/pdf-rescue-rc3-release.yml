name: PDF Rescue RC3 Windows Release Gate
on:
  push:
    branches: [pdf-rescue-rc3-ci]
    paths-ignore:
      - 'pdf-rescue-ci-status/**'
      - 'pdf-rescue-fix*/**'
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct verified RC3 source
        shell: pwsh
        run: |
          $head=Get-ChildItem 'pdf-rescue-build-payload/part-*.b64'|Sort-Object Name
          $tail=Get-ChildItem 'pdf-rescue-build-tail3k/tail-*.b64'|Sort-Object Name
          if($head.Count-ne 7){throw "Expected 7 head chunks; found $($head.Count)"}
          if($tail.Count-ne 11){throw "Expected 11 tail chunks; found $($tail.Count)"}
          $b64=(($head+$tail)|%{Get-Content $_.FullName -Raw})-join''
          if($b64.Length-ne 87192){throw "Payload length mismatch: $($b64.Length)"}
          $arc="$env:RUNNER_TEMP\pdf-rescue-rc3-build.tar.xz"
          [IO.File]::WriteAllBytes($arc,[Convert]::FromBase64String($b64))
          $hash=(Get-FileHash $arc -Algorithm SHA256).Hash.ToLowerInvariant()
          if($hash-ne'ea150483853ad62e544874f3831bb1005d7060af233a56ad6c23eaf75309a955'){throw "SHA mismatch: $hash"}
          mkdir work-pdf-rescue|Out-Null
          tar -xJf $arc -C work-pdf-rescue
          if(!(Test-Path work-pdf-rescue/PdfRescue.sln)){throw 'Source reconstruction failed'}

          $fixParts=Get-ChildItem 'pdf-rescue-fix1/fix1-*.b64'|Sort-Object Name
          if($fixParts.Count-ne 4){throw "Expected 4 compiler-fix chunks; found $($fixParts.Count)"}
          $fixB64=($fixParts|%{Get-Content $_.FullName -Raw})-join''
          if($fixB64.Length-ne 9104){throw "Compiler-fix payload length mismatch: $($fixB64.Length)"}
          $fixArc="$env:RUNNER_TEMP\pdf-rescue-rc3-fix1.tar.xz"
          [IO.File]::WriteAllBytes($fixArc,[Convert]::FromBase64String($fixB64))
          $fixHash=(Get-FileHash $fixArc -Algorithm SHA256).Hash.ToLowerInvariant()
          if($fixHash-ne'b11619a5ab7c433b5802151b85865a95254d43f5bcb48a5cf461b6f0dc5d227b'){throw "Compiler-fix SHA mismatch: $fixHash"}
          tar -xJf $fixArc -C work-pdf-rescue

          $fix2Parts=Get-ChildItem 'pdf-rescue-fix2/fix2-*.b64'|Sort-Object Name
          if($fix2Parts.Count-ne 5){throw "Expected 5 second-fix chunks; found $($fix2Parts.Count)"}
          $fix2B64=($fix2Parts|%{Get-Content $_.FullName -Raw})-join''
          if($fix2B64.Length-ne 13136){throw "Second-fix payload length mismatch: $($fix2B64.Length)"}
          $fix2Arc="$env:RUNNER_TEMP\pdf-rescue-rc3-fix2.tar.xz"
          [IO.File]::WriteAllBytes($fix2Arc,[Convert]::FromBase64String($fix2B64))
          $fix2Hash=(Get-FileHash $fix2Arc -Algorithm SHA256).Hash.ToLowerInvariant()
          if($fix2Hash-ne'79e99563a8a11f329cf3d4d4c597620ee494920d421f211352a870052d35a858'){throw "Second-fix SHA mismatch: $fix2Hash"}
          tar -xJf $fix2Arc -C work-pdf-rescue

          New-Item -ItemType Directory -Force -Path 'work-pdf-rescue/.github/workflows'|Out-Null
          Copy-Item 'pdf-rescue-ci-support/windows-release.yml' 'work-pdf-rescue/.github/workflows/windows-release.yml' -Force
          if(!(Test-Path 'work-pdf-rescue/.github/workflows/windows-release.yml')){throw 'Production workflow restoration failed'}
          Write-Host "Verified RC3 carrier $hash with fixes $fixHash and $fix2Hash"
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/setup-dotnet@v4
        with: {global-json-file: work-pdf-rescue/global.json}
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --version 6.7.1 -y --no-progress --limit-output
          if($LASTEXITCODE-notin@(0,1641,3010)){exit $LASTEXITCODE}
      - name: Static source checks
        working-directory: work-pdf-rescue
        shell: pwsh
        run: python scripts/static-source-checks.py
      - name: Build and self-test release
        working-directory: work-pdf-rescue
        shell: pwsh
        run: ./scripts/publish-release.ps1
      - name: Install and test installed copy
        working-directory: work-pdf-rescue
        shell: pwsh
        run: ./scripts/verify-installed-release.ps1 -InstallerPath './dist/installer/PDF Rescue Setup.exe' -SamplePdf './dist/release-sample.pdf'
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Rescue-RC3-Windows-Installer
          path: work-pdf-rescue/dist/installer/PDF Rescue Setup.exe
          if-no-files-found: error
          retention-days: 30
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Rescue-RC3-Release-Evidence
          path: |
            work-pdf-rescue/dist/selftest-preinstall/**
            work-pdf-rescue/dist/selftest-installed/**
            work-pdf-rescue/dist/release-sample.pdf
          if-no-files-found: warn
      - name: Publish run status
        if: always()
        shell: pwsh
        run: |
          mkdir pdf-rescue-ci-status -Force|Out-Null
          @"
          run_id=${{ github.run_id }}
          run_number=${{ github.run_number }}
          source_sha=${{ github.sha }}
          result=${{ job.status }}
          "@|Set-Content pdf-rescue-ci-status/latest.txt
          git config user.name pdf-rescue-build-bot
          git config user.email actions@users.noreply.github.com
          git add pdf-rescue-ci-status/latest.txt
          if(git diff --cached --quiet){exit 0}
          git commit -m 'ci: record PDF Rescue Windows run [skip ci]'
          git push origin HEAD:pdf-rescue-rc3-ci
