name: Trace Windows v0.12 exact installer verification

on:
  push:
    branches:
      - trace-v012
    paths:
      - 'release/v012-go.txt'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: trace-windows-v012-exact-final
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      PYTHONUTF8: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout v0.12 release control
        uses: actions/checkout@v4
        with:
          ref: trace-v012
          path: control

      - name: Publish release verification run ID
        shell: pwsh
        working-directory: control
        run: |
          $path='build-status/windows-v012-exact-final.txt'
          New-Item -ItemType Directory -Force -Path (Split-Path $path) | Out-Null
          @"
          run_id=${{ github.run_id }}
          run_number=${{ github.run_number }}
          trigger_sha=${{ github.sha }}
          source_gate_run=32635967904
          version=0.12.0
          result=running
          workflow=Trace Windows v0.12 exact installer verification
          "@ | Set-Content $path
          git config user.name 'trace-build-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add $path
          git commit -m 'ci: record v0.12 exact release run [skip ci]'
          if ($LASTEXITCODE -ne 0) { throw 'Could not commit v0.12 release run ID.' }
          git pull --rebase origin trace-v012
          if ($LASTEXITCODE -ne 0) { throw 'Could not rebase v0.12 release run ID.' }
          git push origin HEAD:trace-v012
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish v0.12 release run ID.' }

      - name: Download Windows-green v0.12 source checkpoint
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path source/work | Out-Null
          gh run download 32635967904 --repo $env:GITHUB_REPOSITORY --name 'Trace-v0.12-Analysis-Green-Source' --dir source/work
          if ($LASTEXITCODE -ne 0) { throw 'Could not retrieve the Windows-green v0.12 source checkpoint.' }
          foreach ($required in @('source/work/index.html','source/work/src/app.js','source/work/src-tauri/Cargo.toml','source/work/setup-shell/index.html','source/work/setup-shell/src-tauri/Cargo.toml')) {
            if (!(Test-Path $required)) { throw "Green source checkpoint is incomplete: $required" }
          }
          if ((Get-Content source/work/package.json -Raw) -notmatch '"version"\s*:\s*"0\.12\.0"') { throw 'Root package is not Trace 0.12.0.' }
          if ((Get-Content source/work/src-tauri/tauri.conf.json -Raw) -notmatch '"version"\s*:\s*"0\.12\.0"') { throw 'Native Tauri package is not Trace 0.12.0.' }

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add branded setup silent verification CLI
        shell: pwsh
        working-directory: source
        run: |
          python ../control/ci/add_trace_setup_cli.py
          if ($LASTEXITCODE -ne 0) { throw 'Could not add TraceSetup silent verification CLI.' }
          $main=Get-Content work/setup-shell/src-tauri/src/main.rs -Raw
          foreach ($token in @('--silent-install','--silent-uninstall','TRACE_SETUP_SILENT_INSTALL_OK','fn silent_install(','cleanup grace period')) {
            if (!$main.Contains($token)) { throw "Missing setup verification token: $token" }
          }

      - name: v0.12 research workflow and preservation contracts
        shell: pwsh
        working-directory: source/work
        run: |
          node --check src/app.js
          if ($LASTEXITCODE -ne 0) { throw 'Trace app JavaScript syntax check failed.' }
          node --check setup-shell/src/app.js
          if ($LASTEXITCODE -ne 0) { throw 'Trace setup JavaScript syntax check failed.' }
          node tests/v12_analysis_math.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Trace v0.12 intercoder mathematics contract failed.' }
          python tests/schema_contract.py
          if ($LASTEXITCODE -ne 0) { throw 'Trace schema contract failed.' }
          python tests/v11_imports_display.py
          if ($LASTEXITCODE -ne 0) { throw 'Trace v0.11 office/survey/display regression failed.' }
          python tests/v11_usability.py
          if ($LASTEXITCODE -ne 0) { throw 'Trace v0.11 usability regression failed.' }
          python tests/v11_transcription.py
          if ($LASTEXITCODE -ne 0) { throw 'Trace v0.11 transcription regression failed.' }
          python tests/v11_pdf_text.py
          if ($LASTEXITCODE -ne 0) { throw 'Trace v0.11 PDF regression failed.' }
          python tests/v12_analysis.py
          if ($LASTEXITCODE -ne 0) { throw 'Trace v0.12 analysis/intercoder contract failed.' }

      - name: Install Tauri CLI
        shell: pwsh
        working-directory: source/work
        run: |
          npm install --no-save @tauri-apps/cli@2.11.0
          if ($LASTEXITCODE -ne 0) { throw 'Could not install Tauri CLI.' }

      - name: Build and test native Trace v0.12
        shell: pwsh
        working-directory: source/work
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Trace frontend build failed.' }
          cargo check --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Trace native cargo check failed.' }
          cargo test --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Trace native cargo tests failed.' }
          npx tauri build
          if ($LASTEXITCODE -ne 0) { throw 'Trace native Windows bundle build failed.' }

      - name: Stage exact native installer payload
        shell: pwsh
        run: |
          $payload=Get-ChildItem source/work/src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (!$payload) { throw 'Tauri NSIS payload not found.' }
          New-Item -ItemType Directory -Force -Path source/work/setup-shell/src-tauri/payload | Out-Null
          Copy-Item $payload.FullName source/work/setup-shell/src-tauri/payload/trace-payload.exe -Force
          $bytes=[IO.File]::ReadAllBytes('source/work/setup-shell/src-tauri/payload/trace-payload.exe')
          if ($bytes.Length -lt 1MB -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw 'Embedded installer payload is not a credible Windows executable.' }
          $payloadHash=(Get-FileHash $payload.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $embeddedHash=(Get-FileHash source/work/setup-shell/src-tauri/payload/trace-payload.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($payloadHash -ne $embeddedHash) { throw 'Embedded installer payload does not match generated NSIS installer.' }

      - name: Build branded TraceSetup.exe
        shell: pwsh
        working-directory: source/work/setup-shell
        run: |
          npm install --no-save @tauri-apps/cli@2.11.0
          if ($LASTEXITCODE -ne 0) { throw 'Could not install Tauri CLI for setup shell.' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Trace setup frontend build failed.' }
          cargo check --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Trace setup shell cargo check failed.' }
          cargo build --release --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Trace setup shell release build failed.' }

      - name: Assemble exact v0.12 candidate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path source/work/release | Out-Null
          $setup='source/work/setup-shell/src-tauri/target/release/trace-setup.exe'
          if (!(Test-Path $setup)) { throw 'Trace setup shell executable is missing.' }
          Copy-Item $setup source/work/release/TraceSetup.exe -Force
          $hash=(Get-FileHash source/work/release/TraceSetup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "TraceSetup.exe  $hash" | Set-Content source/work/release/SHA256.txt

      - name: Install, launch and uninstall through exact TraceSetup.exe
        shell: pwsh
        run: |
          $setup=(Resolve-Path source/work/release/TraceSetup.exe).Path
          $nativeSetup=(Get-ChildItem source/work/src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1).FullName
          if (!(Test-Path $nativeSetup)) { throw 'Native NSIS installer is missing for equivalence verification.' }

          $referenceDir=Join-Path $env:RUNNER_TEMP 'TraceNativeReferenceInstallV012'
          $installDir=Join-Path $env:RUNNER_TEMP 'TraceExactSetupInstallV012'
          foreach ($dir in @($referenceDir,$installDir)) {
            if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
          }

          $native=Start-Process -FilePath $nativeSetup -ArgumentList @('/S',"/D=$referenceDir") -Wait -PassThru
          if ($native.ExitCode -ne 0) { throw "Native NSIS reference install failed with exit code $($native.ExitCode)." }
          $referenceTrace=Join-Path $referenceDir 'Trace.exe'
          if (!(Test-Path $referenceTrace)) { throw "Reference Trace.exe was not found at $referenceTrace." }
          $referenceHash=(Get-FileHash $referenceTrace -Algorithm SHA256).Hash.ToLowerInvariant()
          $referenceUninstaller=Get-ChildItem $referenceDir -Filter '*uninstall*.exe' -File | Select-Object -First 1
          if (!$referenceUninstaller) { throw 'Native reference uninstaller was not found.' }
          $nativeUninstall=Start-Process -FilePath $referenceUninstaller.FullName -ArgumentList '/S' -Wait -PassThru
          if ($nativeUninstall.ExitCode -ne 0) { throw "Native reference uninstall failed with exit code $($nativeUninstall.ExitCode)." }
          Start-Sleep -Seconds 2

          $researchDir=Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'Trace v0.12 CI Research Data'
          New-Item -ItemType Directory -Force -Path $researchDir | Out-Null
          $sentinel=Join-Path $researchDir 'research-data-must-survive.txt'
          'Trace v0.12 research data preservation sentinel' | Set-Content $sentinel

          & $setup --silent-install --install-dir $installDir
          if ($LASTEXITCODE -ne 0) { throw "TraceSetup.exe silent install failed with exit code $LASTEXITCODE." }
          $installedTrace=Join-Path $installDir 'Trace.exe'
          if (!(Test-Path $installedTrace)) { throw "Installed Trace.exe was not found at $installedTrace." }
          $installedHash=(Get-FileHash $installedTrace -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($installedHash -ne $referenceHash) { throw 'Branded setup installed executable does not match the exact native NSIS payload installation.' }

          $trace=Start-Process -FilePath $installedTrace -WorkingDirectory $installDir -PassThru
          Start-Sleep -Seconds 10
          if ($trace.HasExited) { throw "Installed Trace.exe exited unexpectedly with code $($trace.ExitCode)." }
          Stop-Process -Id $trace.Id -Force
          Start-Sleep -Seconds 2

          & $setup --silent-uninstall --install-dir $installDir
          if ($LASTEXITCODE -ne 0) { throw "TraceSetup.exe silent uninstall failed with exit code $LASTEXITCODE." }
          Start-Sleep -Seconds 3
          if (Test-Path $installedTrace) { throw 'Trace.exe is still present after branded setup uninstall.' }
          if (!(Test-Path $sentinel)) { throw 'Research-data sentinel was removed during uninstall.' }

          $setupHash=(Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          @"
          Trace 0.12.0 exact Windows verification
          trigger_sha=${{ github.sha }}
          run_id=${{ github.run_id }}
          source_gate_run=32635967904
          TraceSetup_sha256=$setupHash
          exact_branded_install=true
          embedded_payload_matches_generated_nsis=true
          installed_exe_matches_native_payload=true
          installed_copy_launched=true
          installed_copy_survived_10_seconds=true
          exact_branded_uninstall=true
          research_data_preserved=true
          office_survey_imports_green=true
          display_readability_green=true
          search_coding_annotations_green=true
          offline_transcription_green=true
          pdf_text_analysis_green=true
          named_coders_green=true
          participant_code_matrix_green=true
          cooccurrence_green=true
          negative_case_finder_green=true
          group_comparison_green=true
          intercoder_agreement_green=true
          cohen_kappa_green=true
          analysis_csv_exports_green=true
          "@ | Set-Content source/work/release/FINAL-VERIFICATION.txt
          Get-Content source/work/release/FINAL-VERIFICATION.txt

      - name: Upload exact verified v0.12 release
        uses: actions/upload-artifact@v4
        with:
          name: Trace-v0.12-Exact-Verified-Windows-Release
          if-no-files-found: error
          retention-days: 14
          path: |
            source/work/release/TraceSetup.exe
            source/work/release/SHA256.txt
            source/work/release/FINAL-VERIFICATION.txt
            source/work/src-tauri/target/release/Trace.exe
            source/work/src-tauri/target/release/bundle/nsis/*.exe
            source/work/src-tauri/target/release/bundle/msi/*.msi

      - name: Publish exact release result
        if: always()
        shell: pwsh
        working-directory: control
        run: |
          $status=@"
          run_id=${{ github.run_id }}
          run_number=${{ github.run_number }}
          trigger_sha=${{ github.sha }}
          source_gate_run=32635967904
          version=0.12.0
          result=${{ job.status }}
          workflow=Trace Windows v0.12 exact installer verification
          verification=green_source_checkpoint+v012_contracts+native_build+native_tests+nsis_payload+branded_setup+exact_install_equivalence+installed_launch+exact_uninstall+research_data_preservation+release_artifact
          "@
          git config user.name 'trace-build-bot'
          git config user.email 'actions@users.noreply.github.com'
          git reset --hard HEAD
          git pull --rebase origin trace-v012
          if ($LASTEXITCODE -ne 0) { throw 'Could not rebase before publishing v0.12 release result.' }
          $status | Set-Content build-status/windows-v012-exact-final.txt
          git add build-status/windows-v012-exact-final.txt
          if (git status --porcelain) {
            git commit -m 'ci: record v0.12 exact release result [skip ci]'
            if ($LASTEXITCODE -ne 0) { throw 'Could not commit v0.12 release result.' }
            git push origin HEAD:trace-v012
            if ($LASTEXITCODE -ne 0) { throw 'Could not publish v0.12 release result.' }
          }
