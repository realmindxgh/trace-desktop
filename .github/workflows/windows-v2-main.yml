name: Trace Windows v0.10 functional release candidate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'build-status/**'

permissions:
  contents: write

concurrency:
  group: trace-windows-v010-main
  cancel-in-progress: true

jobs:
  windows-v010:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish run ID
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build-status | Out-Null
          @"
          run_id=${{ github.run_id }}
          run_number=${{ github.run_number }}
          source_sha=${{ github.sha }}
          result=running
          workflow=Trace Windows v0.10 functional release candidate
          "@ | Set-Content build-status/windows-v010-main.txt
          git config user.name 'trace-build-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add build-status/windows-v010-main.txt
          git commit -m 'ci: record Windows v0.10 run start [skip ci]'
          git push origin HEAD:main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Reconstruct verified Trace base source
        shell: pwsh
        run: |
          $parts = Get-ChildItem bootstrap/v2/part* | Sort-Object Name
          if ($parts.Count -ne 8) { throw "Incomplete Trace base bootstrap. Expected 8 parts, found $($parts.Count)." }
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          if ($b64.Length -ne 101964) { throw "Trace base bootstrap length mismatch: $($b64.Length)" }
          $archive = Join-Path $env:RUNNER_TEMP 'trace-base.tar.xz'
          [IO.File]::WriteAllBytes($archive, [Convert]::FromBase64String($b64))
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '6a444acb5b8a25a673c39ccc02374998628c36d6ad4af7e82b32564ab965c074') { throw "Trace base SHA-256 mismatch: $hash" }
          New-Item -ItemType Directory -Force -Path work | Out-Null
          python -c "import tarfile; tarfile.open(r'$archive','r:xz').extractall('work')"
          if (!(Test-Path work/src-tauri/Cargo.toml)) { throw 'Trace base source reconstruction failed.' }
          Write-Host "Trace base verified: $hash"

      - name: Apply verified v0.10 functional source patch
        shell: pwsh
        run: |
          $parts = Get-ChildItem bootstrap/v010/part* | Sort-Object Name
          if ($parts.Count -ne 4) { throw "Incomplete Trace v0.10 patch. Expected 4 parts, found $($parts.Count)." }
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          if ($b64.Length -ne 43260) { throw "Trace v0.10 patch length mismatch: $($b64.Length)" }
          $compressed = Join-Path $env:RUNNER_TEMP 'trace-v010.patch.xz'
          [IO.File]::WriteAllBytes($compressed, [Convert]::FromBase64String($b64))
          $hash = (Get-FileHash $compressed -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'fb595dd3bbf9d23b10d4aaacd8a907119eb495448418d88bb33eb52c045633da') { throw "Trace v0.10 patch SHA-256 mismatch: $hash" }
          $patch = Join-Path $env:RUNNER_TEMP 'trace-v010.patch'
          python -c "import lzma,pathlib; pathlib.Path(r'$patch').write_bytes(lzma.decompress(pathlib.Path(r'$compressed').read_bytes()))"
          git apply --check --directory=work $patch
          if ($LASTEXITCODE -ne 0) { throw 'Trace v0.10 patch preflight failed.' }
          git apply --directory=work $patch
          if ($LASTEXITCODE -ne 0) { throw 'Trace v0.10 patch application failed.' }
          New-Item -ItemType Directory -Force -Path work/setup-shell/src-tauri/icons | Out-Null
          Copy-Item work/src-tauri/icons/icon.ico work/setup-shell/src-tauri/icons/icon.ico -Force
          python -c "import json,pathlib; p=pathlib.Path('work'); assert json.loads((p/'package.json').read_text())['version']=='0.10.0'; assert (p/'tests/v10_functional.py').is_file(); print('Trace v0.10 source overlay verified')"
          Write-Host "Trace v0.10 patch verified: $hash"

      - name: Prepare Windows assets
        working-directory: work
        shell: pwsh
        run: |
          python -m pip install pillow
          python scripts/ci_prepare_assets.py
          Copy-Item src-tauri/windows/installer-header.bmp src-tauri/windows/trace-installer-header.bmp -Force
          Copy-Item src-tauri/windows/installer-sidebar.bmp src-tauri/windows/trace-installer-sidebar.bmp -Force
          $required = @(
            'src-tauri/icons/icon.ico',
            'src-tauri/windows/trace-installer-header.bmp',
            'src-tauri/windows/trace-installer-sidebar.bmp',
            'src-tauri/windows/installer-hooks.nsh',
            'setup-shell/src-tauri/icons/icon.ico'
          )
          foreach ($file in $required) {
            if (!(Test-Path $file)) { throw "Required Windows bundle asset is missing: $file" }
            Write-Host "Bundle asset ready: $file ($((Get-Item $file).Length) bytes)"
          }

      - name: Functional and source contract tests
        working-directory: work
        run: |
          node --check src/app.js
          node --check setup-shell/src/app.js
          python tests/schema_contract.py
          python tests/v06_features.py
          python tests/v07_installer.py
          python tests/v08_release.py
          python tests/v09_release.py
          python tests/v10_functional.py
          python tests/package_roundtrip.py
          python tests/refi_roundtrip.py

      - name: Install Tauri CLI
        working-directory: work
        run: npm install --no-save @tauri-apps/cli@2.11.0

      - name: Build Trace frontend
        working-directory: work
        run: npm run build

      - name: Rust compile check
        working-directory: work
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build Trace application and Windows installers
        working-directory: work
        run: npx tauri build

      - name: Stage NSIS payload for branded setup
        shell: pwsh
        run: |
          $payload = Get-ChildItem work/src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (!$payload) { throw 'Tauri NSIS payload not found.' }
          New-Item -ItemType Directory -Force -Path work/setup-shell/src-tauri/payload | Out-Null
          Copy-Item $payload.FullName work/setup-shell/src-tauri/payload/trace-payload.exe -Force
          $bytes = [IO.File]::ReadAllBytes('work/setup-shell/src-tauri/payload/trace-payload.exe')
          if ($bytes.Length -lt 1MB -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw 'Embedded installer payload is not a credible Windows executable.' }
          $payloadHash = (Get-FileHash work/setup-shell/src-tauri/payload/trace-payload.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Native NSIS payload staged: $($bytes.Length) bytes SHA256=$payloadHash"

      - name: Upload native installer checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: Trace-v0.10-Native-Installers
          if-no-files-found: error
          retention-days: 14
          path: |
            work/src-tauri/target/release/Trace.exe
            work/src-tauri/target/release/bundle/nsis/*.exe
            work/src-tauri/target/release/bundle/msi/*.msi

      - name: Build branded Trace setup frontend
        working-directory: work/setup-shell
        run: |
          npm install --no-save @tauri-apps/cli@2.11.0
          npm run build

      - name: Compile branded Trace setup shell
        working-directory: work/setup-shell
        shell: pwsh
        run: |
          cargo check --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "Trace setup shell check failed with exit code $LASTEXITCODE" }
          cargo build --release --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "Trace setup shell release build failed with exit code $LASTEXITCODE" }

      - name: Assemble Windows release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path work/release | Out-Null
          $setup = 'work/setup-shell/src-tauri/target/release/trace-setup.exe'
          if (!(Test-Path $setup)) { throw 'Trace setup shell executable is missing.' }
          Copy-Item $setup work/release/TraceSetup.exe -Force
          $size = (Get-Item work/release/TraceSetup.exe).Length
          if ($size -lt 1MB) { throw "TraceSetup.exe is unexpectedly small: $size bytes" }
          $hash = (Get-FileHash work/release/TraceSetup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "TraceSetup.exe  $hash" | Set-Content work/release/SHA256.txt
          @"
          Trace 0.10.0 Windows functional release candidate
          Source commit: ${{ github.sha }}
          Workflow run: ${{ github.run_id }}
          TraceSetup.exe SHA256: $hash
          "@ | Set-Content work/release/BUILD-MANIFEST.txt
          Write-Host "TraceSetup.exe $size bytes SHA256=$hash"

      - name: Upload Windows release
        uses: actions/upload-artifact@v4
        with:
          name: Trace-v0.10-Windows-Release
          if-no-files-found: error
          retention-days: 14
          path: |
            work/release/TraceSetup.exe
            work/release/SHA256.txt
            work/release/BUILD-MANIFEST.txt
            work/src-tauri/target/release/Trace.exe
            work/src-tauri/target/release/bundle/nsis/*.exe
            work/src-tauri/target/release/bundle/msi/*.msi

      - name: Publish build status
        if: always()
        shell: pwsh
        run: |
          @"
          run_id=${{ github.run_id }}
          run_number=${{ github.run_number }}
          source_sha=${{ github.sha }}
          result=${{ job.status }}
          workflow=Trace Windows v0.10 functional release candidate
          "@ | Set-Content build-status/windows-v010-main.txt
          git add build-status/windows-v010-main.txt
          if (git status --porcelain) {
            git commit -m 'ci: record Windows v0.10 build [skip ci]'
            git push origin HEAD:main
          }
