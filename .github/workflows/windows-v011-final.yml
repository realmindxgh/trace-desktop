name: Trace Windows v0.11 exact installer verification

on:
  push:
    branches:
      - trace-v011-pdf-text-gate
    paths:
      - '.github/workflows/windows-v011-final.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trace-windows-v011-exact-final
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Checkout v0.11 release control
        uses: actions/checkout@v4
        with:
          ref: trace-v011-pdf-text-gate
          path: control

      - name: Publish release verification run ID
        shell: pwsh
        working-directory: control
        run: |
          $path='build-status/windows-v011-exact-final.txt'
          New-Item -ItemType Directory -Force -Path (Split-Path $path) | Out-Null
          @"
          run_id=${{ github.run_id }}
          run_number=${{ github.run_number }}
          trigger_sha=${{ github.sha }}
          version=0.11.0
          result=running
          workflow=Trace Windows v0.11 exact installer verification
          "@ | Set-Content $path
          git config user.name 'trace-build-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add $path
          git commit -m 'ci: record v0.11 exact release run [skip ci]'
          if ($LASTEXITCODE -ne 0) { throw 'Could not commit v0.11 release run ID.' }
          git pull --rebase origin trace-v011-pdf-text-gate
          if ($LASTEXITCODE -ne 0) { throw 'Could not rebase v0.11 release run ID.' }
          git push origin HEAD:trace-v011-pdf-text-gate
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish v0.11 release run ID.' }

      - name: Checkout proven transcription checkpoint control
        uses: actions/checkout@v4
        with:
          ref: eebc47e418003811a0cb27e1b684601a5c77bdcf
          path: source

      - name: Inject corrected transcription checkpoint bytes
        shell: pwsh
        run: |
          Copy-Item control/bootstrap/v011transcribe/part00 source/bootstrap/v011transcribe/part00 -Force
          Copy-Item control/bootstrap/v011transcribe/part01 source/bootstrap/v011transcribe/part01 -Force
          $wf='source/.github/workflows/v011-transcription-check.yml'
          $text=Get-Content $wf -Raw
          $text=$text.Replace('17960','18928')
          $text=$text.Replace('8ae71006df954e47040b79fda535b6212bc2949ce4efa7613ab90bbd0204515a','7e8ea74aec6da10154ae9dc7cabe4b252c20ba1432da0ad096496876c02d9b3e')
          Set-Content $wf $text

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Reconstruct verified v0.11 source layers
        shell: pwsh
        working-directory: source
        run: |
          python -m pip install pyyaml
          if ($LASTEXITCODE -ne 0) { throw 'Could not install PyYAML.' }
          @'
          import pathlib, subprocess, tempfile, yaml
          root = pathlib.Path.cwd()
          workflow = yaml.safe_load((root / '.github/workflows/v011-transcription-check.yml').read_text(encoding='utf-8'))
          steps = workflow['jobs']['check']['steps']
          wanted = [
              'Reconstruct verified Trace base source',
              'Apply verified v0.10 overlay',
              'Apply verified v0.11 imports and display overlay',
              'Apply verified v0.11 usability overlay',
              'Apply verified v0.11 local transcription overlay',
              'Prepare Windows assets',
          ]
          by_name = {s.get('name'): s for s in steps}
          for name in wanted:
              step = by_name[name]
              cwd = root / step.get('working-directory', '.')
              with tempfile.NamedTemporaryFile('w', suffix='.ps1', encoding='utf-8', delete=False) as f:
                  f.write("$ErrorActionPreference = 'Stop'\n")
                  f.write(step['run'])
                  script = f.name
              print(f'RELEASE REPLAY STEP: {name}', flush=True)
              subprocess.run(['pwsh','-NoProfile','-File',script], cwd=cwd, check=True)
          '@ | Set-Content replay_release_layers.py
          python replay_release_layers.py
          if ($LASTEXITCODE -ne 0) { throw 'Could not reconstruct verified v0.11 release layers.' }

      - name: Apply corrected Windows-green PDF text overlay
        shell: pwsh
        working-directory: source
        run: |
          $parts=Get-ChildItem ../control/bootstrap/v011pdf/part* | Sort-Object Name
          if ($parts.Count -ne 1) { throw "Incomplete PDF overlay. Expected 1 part, found $($parts.Count)." }
          $b64=($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          if ($b64.Length -ne 8556) { throw "PDF overlay base64 length mismatch: $($b64.Length)" }
          $compressed=Join-Path $env:RUNNER_TEMP 'trace-v011pdf.patch.xz'
          [IO.File]::WriteAllBytes($compressed,[Convert]::FromBase64String($b64))
          $hash=(Get-FileHash $compressed -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '6e50b81fac3c4822f3ec6e452e5e8bbfd7f0a8628b0f99d7dbb7502c3ccf2128') { throw "PDF overlay SHA-256 mismatch: $hash" }
          $patch=Join-Path $env:RUNNER_TEMP 'trace-v011pdf.patch'
          python -c "import lzma,pathlib; pathlib.Path(r'$patch').write_bytes(lzma.decompress(pathlib.Path(r'$compressed').read_bytes()))"
          if ($LASTEXITCODE -ne 0) { throw 'Could not decompress PDF overlay.' }
          $patchHash=(Get-FileHash $patch -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($patchHash -ne '8d1ae4be2c70243f36a815a020ff056701944d5ac2e0fe088403fa5d2b94fbb0') { throw "PDF patch SHA-256 mismatch: $patchHash" }
          git apply --check --directory=work $patch
          if ($LASTEXITCODE -ne 0) { throw 'PDF overlay preflight failed in release reconstruction.' }
          git apply --directory=work $patch
          if ($LASTEXITCODE -ne 0) { throw 'PDF overlay application failed in release reconstruction.' }

      - name: Add branded setup silent verification CLI
        shell: pwsh
        working-directory: source
        run: |
          python ../control/ci/add_trace_setup_cli.py
          if ($LASTEXITCODE -ne 0) { throw 'Could not add TraceSetup silent verification CLI.' }
          $main=Get-Content work/setup-shell/src-tauri/src/main.rs -Raw
          foreach ($token in @('--silent-install','--silent-uninstall','TRACE_SETUP_SILENT_INSTALL_OK','fn silent_install(','cleanup grace period')) {
            if (!$main.Contains($token)) { throw "Missing setup verification token: $token" }
          }

      - name: v0.11 research workflow and preservation contracts
        shell: pwsh
        working-directory: source/work
        run: |
          node --check src/app.js
          if ($LASTEXITCODE -ne 0) { throw 'Trace app JavaScript syntax check failed.' }
          node --check setup-shell/src/app.js
          if ($LASTEXITCODE -ne 0) { throw 'Trace setup JavaScript syntax check failed.' }
          python tests/schema_contract.py
          if ($LASTEXITCODE -ne 0) { throw 'Trace schema contract failed.' }
          $compat='tests/v10_release_compat.py'
          (Get-Content tests/v10_functional.py -Raw).Replace("'0.10.0'","'0.11.0'") | Set-Content $compat
          python $compat
          $compatExit=$LASTEXITCODE
          Remove-Item $compat -Force
          if ($compatExit -ne 0) { throw 'Trace v0.10 behavioral regression contract failed under v0.11.' }
          python tests/v11_imports_display.py
          if ($LASTEXITCODE -ne 0) { throw 'Trace v0.11 office/survey/display contract failed.' }
          python tests/v11_usability.py
          if ($LASTEXITCODE -ne 0) { throw 'Trace v0.11 usability contract failed.' }
          python tests/v11_transcription.py
          if ($LASTEXITCODE -ne 0) { throw 'Trace v0.11 transcription contract failed.' }
          python tests/v11_pdf_text.py
          if ($LASTEXITCODE -ne 0) { throw 'Trace v0.11 PDF contract failed.' }
          python ../../control/ci/v011_core_functional.py .
          if ($LASTEXITCODE -ne 0) { throw 'Trace v0.11 core feature preservation audit failed in release source.' }

      - name: Install Tauri CLI
        shell: pwsh
        working-directory: source/work
        run: |
          npm install --no-save @tauri-apps/cli@2.11.0
          if ($LASTEXITCODE -ne 0) { throw 'Could not install Tauri CLI.' }

      - name: Build and test native Trace v0.11
        shell: pwsh
        working-directory: source/work
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Trace frontend build failed.' }
          cargo check --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Trace native cargo check failed.' }
          cargo test --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Trace native cargo tests failed.' }
          npx tauri build
          if ($LASTEXITCODE -ne 0) { throw 'Trace native Windows bundle build failed.' }

      - name: Stage exact native installer payload
        shell: pwsh
        run: |
          $payload=Get-ChildItem source/work/src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (!$payload) { throw 'Tauri NSIS payload not found.' }
          New-Item -ItemType Directory -Force -Path source/work/setup-shell/src-tauri/payload | Out-Null
          Copy-Item $payload.FullName source/work/setup-shell/src-tauri/payload/trace-payload.exe -Force
          $bytes=[IO.File]::ReadAllBytes('source/work/setup-shell/src-tauri/payload/trace-payload.exe')
          if ($bytes.Length -lt 1MB -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw 'Embedded installer payload is not a credible Windows executable.' }
          $payloadHash=(Get-FileHash $payload.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $embeddedHash=(Get-FileHash source/work/setup-shell/src-tauri/payload/trace-payload.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($payloadHash -ne $embeddedHash) { throw 'Embedded installer payload does not match generated NSIS installer.' }

      - name: Build branded TraceSetup.exe
        shell: pwsh
        working-directory: source/work/setup-shell
        run: |
          npm install --no-save @tauri-apps/cli@2.11.0
          if ($LASTEXITCODE -ne 0) { throw 'Could not install Tauri CLI for setup shell.' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Trace setup frontend build failed.' }
          cargo check --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Trace setup shell cargo check failed.' }
          cargo build --release --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Trace setup shell release build failed.' }

      - name: Assemble exact v0.11 candidate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path source/work/release | Out-Null
          $setup='source/work/setup-shell/src-tauri/target/release/trace-setup.exe'
          if (!(Test-Path $setup)) { throw 'Trace setup shell executable is missing.' }
          Copy-Item $setup source/work/release/TraceSetup.exe -Force
          $hash=(Get-FileHash source/work/release/TraceSetup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "TraceSetup.exe  $hash" | Set-Content source/work/release/SHA256.txt

      - name: Install, launch and uninstall through exact TraceSetup.exe
        shell: pwsh
        run: |
          $setup=(Resolve-Path source/work/release/TraceSetup.exe).Path
          $nativeSetup=(Get-ChildItem source/work/src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1).FullName
          if (!(Test-Path $nativeSetup)) { throw 'Native NSIS installer is missing for equivalence verification.' }

          $referenceDir=Join-Path $env:RUNNER_TEMP 'TraceNativeReferenceInstallV011'
          $installDir=Join-Path $env:RUNNER_TEMP 'TraceExactSetupInstallV011'
          foreach ($dir in @($referenceDir,$installDir)) {
            if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
          }

          $native=Start-Process -FilePath $nativeSetup -ArgumentList @('/S',"/D=$referenceDir") -Wait -PassThru
          if ($native.ExitCode -ne 0) { throw "Native NSIS reference install failed with exit code $($native.ExitCode)." }
          $referenceTrace=Join-Path $referenceDir 'Trace.exe'
          if (!(Test-Path $referenceTrace)) { throw "Reference Trace.exe was not found at $referenceTrace." }
          $referenceHash=(Get-FileHash $referenceTrace -Algorithm SHA256).Hash.ToLowerInvariant()
          $referenceUninstaller=Get-ChildItem $referenceDir -Filter '*uninstall*.exe' -File | Select-Object -First 1
          if (!$referenceUninstaller) { throw 'Native reference uninstaller was not found.' }
          $nativeUninstall=Start-Process -FilePath $referenceUninstaller.FullName -ArgumentList '/S' -Wait -PassThru
          if ($nativeUninstall.ExitCode -ne 0) { throw "Native reference uninstall failed with exit code $($nativeUninstall.ExitCode)." }
          Start-Sleep -Seconds 2

          $researchDir=Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'Trace v0.11 CI Research Data'
          New-Item -ItemType Directory -Force -Path $researchDir | Out-Null
          $sentinel=Join-Path $researchDir 'research-data-must-survive.txt'
          'Trace v0.11 research data preservation sentinel' | Set-Content $sentinel

          & $setup --silent-install --install-dir $installDir
          if ($LASTEXITCODE -ne 0) { throw "TraceSetup.exe silent install failed with exit code $LASTEXITCODE." }
          $installedTrace=Join-Path $installDir 'Trace.exe'
          if (!(Test-Path $installedTrace)) { throw "Installed Trace.exe was not found at $installedTrace." }
          $installedHash=(Get-FileHash $installedTrace -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($installedHash -ne $referenceHash) { throw 'Branded setup installed executable does not match the exact native NSIS payload installation.' }

          $trace=Start-Process -FilePath $installedTrace -WorkingDirectory $installDir -PassThru
          Start-Sleep -Seconds 10
          if ($trace.HasExited) { throw "Installed Trace.exe exited unexpectedly with code $($trace.ExitCode)." }
          Stop-Process -Id $trace.Id -Force
          Start-Sleep -Seconds 2

          & $setup --silent-uninstall --install-dir $installDir
          if ($LASTEXITCODE -ne 0) { throw "TraceSetup.exe silent uninstall failed with exit code $LASTEXITCODE." }
          Start-Sleep -Seconds 3
          if (Test-Path $installedTrace) { throw 'Trace.exe is still present after branded setup uninstall.' }
          if (!(Test-Path $sentinel)) { throw 'Research-data sentinel was removed during uninstall.' }

          $setupHash=(Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          @"
          Trace 0.11.0 exact Windows verification
          trigger_sha=${{ github.sha }}
          run_id=${{ github.run_id }}
          TraceSetup_sha256=$setupHash
          exact_branded_install=true
          embedded_payload_matches_generated_nsis=true
          installed_exe_matches_native_payload=true
          installed_copy_launched=true
          installed_copy_survived_10_seconds=true
          exact_branded_uninstall=true
          research_data_preserved=true
          v010_behavior_regression_green=true
          office_survey_imports_green=true
          display_readability_green=true
          search_coding_annotations_green=true
          offline_transcription_green=true
          pdf_text_analysis_green=true
          core_feature_preservation_green=true
          "@ | Set-Content source/work/release/FINAL-VERIFICATION.txt
          Get-Content source/work/release/FINAL-VERIFICATION.txt

      - name: Upload exact verified v0.11 release
        uses: actions/upload-artifact@v4
        with:
          name: Trace-v0.11-Exact-Verified-Windows-Release
          if-no-files-found: error
          retention-days: 14
          path: |
            source/work/release/TraceSetup.exe
            source/work/release/SHA256.txt
            source/work/release/FINAL-VERIFICATION.txt
            source/work/src-tauri/target/release/Trace.exe
            source/work/src-tauri/target/release/bundle/nsis/*.exe
            source/work/src-tauri/target/release/bundle/msi/*.msi

      - name: Publish exact release result
        if: always()
        shell: pwsh
        working-directory: control
        run: |
          $status=@"
          run_id=${{ github.run_id }}
          run_number=${{ github.run_number }}
          trigger_sha=${{ github.sha }}
          version=0.11.0
          result=${{ job.status }}
          workflow=Trace Windows v0.11 exact installer verification
          verification=verified_layer_reconstruction+corrected_pdf_hash+v011_contracts+core_feature_audit+native_build+native_tests+nsis_payload+branded_setup+exact_install_equivalence+installed_launch+exact_uninstall+research_data_preservation+release_artifact
          "@
          git config user.name 'trace-build-bot'
          git config user.email 'actions@users.noreply.github.com'
          git reset --hard HEAD
          git pull --rebase origin trace-v011-pdf-text-gate
          if ($LASTEXITCODE -ne 0) { throw 'Could not rebase before publishing v0.11 release result.' }
          $status | Set-Content build-status/windows-v011-exact-final.txt
          git add build-status/windows-v011-exact-final.txt
          if (git status --porcelain) {
            git commit -m 'ci: record v0.11 exact release result [skip ci]'
            if ($LASTEXITCODE -ne 0) { throw 'Could not commit v0.11 release result.' }
            git push origin HEAD:trace-v011-pdf-text-gate
            if ($LASTEXITCODE -ne 0) { throw 'Could not publish v0.11 release result.' }
          }
