name: AsantePDF V1 Windows Release Gate

on:
  push:
    branches: [asantepdf-v1-ci]
    paths-ignore:
      - 'asantepdf-ci-status/**'
      - 'asantepdf-debug/**'
      - '.github/workflows/asantepdf-introspect*.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 90
    concurrency:
      group: asantepdf-v1-release
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct verified source and AsantePDF overlays
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Restore-B64Archive([string[]]$Files,[int]$Count,[int]$Length,[string]$Sha,[string]$Archive,[string]$Target) {
            $parts = Get-Item $Files | Sort-Object Name
            if ($parts.Count -ne $Count) { throw "Expected $Count chunks for ${Archive}; found $($parts.Count)" }
            $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
            if ($b64.Length -ne $Length) { throw "Payload length mismatch for ${Archive}: $($b64.Length)" }
            $path = Join-Path $env:RUNNER_TEMP $Archive
            [IO.File]::WriteAllBytes($path,[Convert]::FromBase64String($b64))
            $actual = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $Sha) { throw "SHA mismatch for ${Archive}: $actual" }
            tar -xJf $path -C $Target
          }

          New-Item -ItemType Directory -Force -Path work-asantepdf | Out-Null
          $baseParts = @((Get-ChildItem 'pdf-rescue-build-payload/part-*.b64').FullName) + @((Get-ChildItem 'pdf-rescue-build-tail3k/tail-*.b64').FullName)
          Restore-B64Archive $baseParts 18 87192 'ea150483853ad62e544874f3831bb1005d7060af233a56ad6c23eaf75309a955' 'pdf-rescue-baseline.tar.xz' 'work-asantepdf'
          Restore-B64Archive @((Get-ChildItem 'pdf-rescue-fix1/fix1-*.b64').FullName) 4 9104 'b11619a5ab7c433b5802151b85865a95254d43f5bcb48a5cf461b6f0dc5d227b' 'pdf-rescue-fix1.tar.xz' 'work-asantepdf'
          Restore-B64Archive @((Get-ChildItem 'pdf-rescue-fix2/fix2-*.b64').FullName) 5 13136 '79e99563a8a11f329cf3d4d4c597620ee494920d421f211352a870052d35a858' 'pdf-rescue-fix2.tar.xz' 'work-asantepdf'
          Restore-B64Archive @((Get-ChildItem 'asantepdf-v1/code-*.b64').FullName) 9 59868 'be179526d815a69ef59a584d6643b5b18b5cb318f1c57170564e7544f7d2aa91' 'asantepdf-v1.tar.xz' 'work-asantepdf'
          Restore-B64Archive @((Get-ChildItem 'asantepdf-fix3/fix3.b64').FullName) 1 2236 'b8a1815f03874facaea3459b055688fef6ade330ba0573c594f5a954124364e9' 'asantepdf-fix3.tar.xz' 'work-asantepdf'
          Restore-B64Archive @((Get-ChildItem 'asantepdf-fix4/fix4-*.b64').FullName) 1 6648 '74f7f95a8751b6b4df5c82bde4cb77f8eca89b316c8d95be7f4e29d1b300c34f' 'asantepdf-fix4.tar.xz' 'work-asantepdf'
          Restore-B64Archive @((Get-ChildItem 'asantepdf-fix5/fix5-*.b64').FullName) 1 3100 'b90935faf9bb14ae0a40bef5f4b8798ca03e5b411d7c9ed5e5043dcc9bc63046' 'asantepdf-fix5.tar.xz' 'work-asantepdf'
          & (Resolve-Path 'asantepdf-fix6/apply-fix6.ps1') -Root (Resolve-Path 'work-asantepdf')

          # Rehydrate the approved Ghana-inspired AsantePDF icon from a text-safe carrier.
          $brandCarrier = Get-Content 'asantepdf-branding/asantepdf-icon.png.b64' -Raw
          $brandCarrier = $brandCarrier -replace '\s',''
          $brandPng = 'work-asantepdf/assets/asantepdf-icon.png'
          [IO.File]::WriteAllBytes($brandPng,[Convert]::FromBase64String($brandCarrier))
          $pngBytes = [IO.File]::ReadAllBytes($brandPng)
          $pngHash = (Get-FileHash $brandPng -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($pngHash -ne 'c4d4ada6a84656ae76551e7fbdf7ffff0e3767d98832dc5b9aad24c23491d1cf') { throw "Approved AsantePDF icon SHA mismatch: $pngHash" }

          # Build a valid Windows ICO containing the approved 256x256 PNG.
          $icoPath = 'work-asantepdf/assets/asantepdf.ico'
          $fs = [IO.File]::Open($icoPath,[IO.FileMode]::Create,[IO.FileAccess]::Write)
          try {
            $bw = New-Object IO.BinaryWriter($fs)
            $bw.Write([UInt16]0)
            $bw.Write([UInt16]1)
            $bw.Write([UInt16]1)
            $bw.Write([Byte]0)
            $bw.Write([Byte]0)
            $bw.Write([Byte]0)
            $bw.Write([Byte]0)
            $bw.Write([UInt16]1)
            $bw.Write([UInt16]32)
            $bw.Write([UInt32]$pngBytes.Length)
            $bw.Write([UInt32]22)
            $bw.Write($pngBytes)
            $bw.Flush()
          } finally { $fs.Dispose() }
          if ((Get-Item $icoPath).Length -le $pngBytes.Length) { throw 'Generated AsantePDF ICO is invalid.' }

          $projectPath = 'work-asantepdf/src/PdfRescue.App/PdfRescue.App.csproj'
          $project = Get-Content $projectPath -Raw
          $project = $project -replace '(?m)^\s*<Resource Include="\.\.\\\.\.\\assets\\asantepdf-(?:icon|brand)\.png"[^\r\n]*\r?\n', ''
          if ($project -notmatch 'Resource Include="\.\.\\\.\.\\assets\\asantepdf\.ico"') {
            $project = $project -replace '</Project>', '<ItemGroup><Resource Include="..\..\assets\asantepdf.ico" Link="assets\asantepdf.ico" /><Resource Include="..\..\assets\asantepdf-icon.png" Link="assets\asantepdf-icon.png" /></ItemGroup></Project>'
          }
          Set-Content $projectPath $project -Encoding UTF8

          if (!(Select-String 'work-asantepdf/src/PdfRescue.App/MainWindow.xaml' -Pattern 'AsantePDF' -Quiet)) { throw 'AsantePDF UI overlay is missing.' }
          if (!(Select-String 'work-asantepdf/src/PdfRescue.App/Services/PdfFormService.cs' -Pattern 'PdfSharp.Pdf.AcroForms' -Quiet)) { throw 'Windows-proven PDFsharp forms API restoration is missing.' }

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: work-asantepdf/global.json

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --version 6.7.1 -y --no-progress --limit-output
          if ($LASTEXITCODE -notin @(0,1641,3010)) { exit $LASTEXITCODE }

      - name: Static AsantePDF source checks
        working-directory: work-asantepdf
        shell: pwsh
        run: python scripts/static-source-checks.py

      - name: Build, self-test and package AsantePDF
        working-directory: work-asantepdf
        shell: pwsh
        run: ./scripts/publish-release.ps1

      - name: Install and test exact generated AsantePDF installer
        working-directory: work-asantepdf
        shell: pwsh
        run: ./scripts/verify-installed-release.ps1 -InstallerPath './dist/installer/AsantePDF Setup.exe' -SamplePdf './dist/release-sample.pdf'

      - name: Upload AsantePDF installer
        uses: actions/upload-artifact@v4
        with:
          name: AsantePDF-V1-Windows-Installer
          path: work-asantepdf/dist/installer/AsantePDF Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AsantePDF-V1-Release-Evidence
          path: |
            work-asantepdf/dist/selftest-preinstall/**
            work-asantepdf/dist/selftest-installed/**
            work-asantepdf/dist/release-sample.pdf
            work-asantepdf/assets/asantepdf.ico
            work-asantepdf/assets/asantepdf-icon.png
          if-no-files-found: warn
          retention-days: 14

      - name: Publish run status
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force asantepdf-ci-status | Out-Null
          @"
          run_id=${{ github.run_id }}
          run_number=${{ github.run_number }}
          source_sha=${{ github.sha }}
          result=${{ job.status }}
          "@ | Set-Content asantepdf-ci-status/latest.txt
          git config user.name asantepdf-build-bot
          git config user.email actions@users.noreply.github.com
          git add asantepdf-ci-status/latest.txt
          if (git diff --cached --quiet) { exit 0 }
          git commit -m 'ci: record AsantePDF Windows run [skip ci]'
          for ($attempt = 1; $attempt -le 6; $attempt++) {
            git pull --rebase origin asantepdf-v1-ci
            if ($LASTEXITCODE -ne 0) { git rebase --abort 2>$null; Start-Sleep -Seconds $attempt; continue }
            git push origin HEAD:asantepdf-v1-ci
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds $attempt
          }
