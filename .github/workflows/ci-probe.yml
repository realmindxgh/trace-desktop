name: Trace CI probe

on:
  push:
    branches: [main]
    paths-ignore:
      - 'build-status/**'

permissions:
  contents: write

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record probe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build-status | Out-Null
          @"
          run_id=${{ github.run_id }}
          source_sha=${{ github.sha }}
          result=success
          "@ | Set-Content build-status/ci-probe.txt
          git config user.name 'trace-build-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add build-status/ci-probe.txt
          git commit -m 'ci: record probe [skip ci]'
          git push origin HEAD:main
