name: Trace v0.12.1 upgrade reproduction

on:
  push:
    branches:
      - trace-v0121
    paths:
      - '.github/workflows/v0121-upgrade-repro.yml'
      - 'release/v0121-repro-go.txt'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: trace-v0121-upgrade-repro
  cancel-in-progress: true

jobs:
  reproduce:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout control
        uses: actions/checkout@v4
        with:
          ref: trace-v0121
          path: control

      - name: Publish reproduction run ID
        shell: pwsh
        working-directory: control
        run: |
          New-Item -ItemType Directory -Force -Path build-status | Out-Null
          @"
          run_id=${{ github.run_id }}
          run_number=${{ github.run_number }}
          result=running
          workflow=Trace v0.12.1 upgrade reproduction
          "@ | Set-Content build-status/v0121-upgrade-repro.txt
          git config user.name 'trace-build-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add build-status/v0121-upgrade-repro.txt
          git commit -m 'ci: record v0.12.1 upgrade repro run [skip ci]'
          git pull --rebase origin trace-v0121
          git push origin HEAD:trace-v0121

      - name: Download verified v0.11 and v0.12 releases
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/v011 | Out-Null
          New-Item -ItemType Directory -Force -Path artifacts/v012 | Out-Null
          gh run download 32582256355 --repo $env:GITHUB_REPOSITORY --name 'Trace-v0.11-Exact-Verified-Windows-Release' --dir artifacts/v011
          if ($LASTEXITCODE -ne 0) { throw 'Could not download verified v0.11 release.' }
          gh run download 32639353769 --repo $env:GITHUB_REPOSITORY --name 'Trace-v0.12-Exact-Verified-Windows-Release' --dir artifacts/v012
          if ($LASTEXITCODE -ne 0) { throw 'Could not download verified v0.12 release.' }
          foreach ($p in @('artifacts/v011/release/TraceSetup.exe','artifacts/v012/release/TraceSetup.exe')) {
            if (!(Test-Path $p)) { throw "Missing release installer: $p" }
          }

      - name: Build exact v0.12 clean-install reference hash
        shell: pwsh
        run: |
          $new=(Resolve-Path 'artifacts/v012/release/TraceSetup.exe').Path
          $refDir=Join-Path $env:RUNNER_TEMP 'TraceV012CleanReference'
          if (Test-Path $refDir) { Remove-Item $refDir -Recurse -Force }
          & $new --silent-install --install-dir $refDir
          if ($LASTEXITCODE -ne 0) { throw "v0.12 clean reference install failed: $LASTEXITCODE" }
          $refExe=Join-Path $refDir 'Trace.exe'
          if (!(Test-Path $refExe)) { throw 'v0.12 clean reference Trace.exe missing.' }
          $refHash=(Get-FileHash $refExe -Algorithm SHA256).Hash.ToLowerInvariant()
          $rawHash=(Get-FileHash 'artifacts/v012/src-tauri/target/release/Trace.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          @"
          clean_reference_hash=$refHash
          raw_build_hash=$rawHash
          raw_matches_clean=$($rawHash -eq $refHash)
          "@ | Set-Content v012-reference-result.txt
          "TRACE_V012_REFERENCE_HASH=$refHash" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Scenario A - closed-app upgrade evidence
        shell: pwsh
        run: |
          $old=(Resolve-Path 'artifacts/v011/release/TraceSetup.exe').Path
          $new=(Resolve-Path 'artifacts/v012/release/TraceSetup.exe').Path
          $dir=Join-Path $env:RUNNER_TEMP 'TraceUpgradeClosed'
          if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }

          & $old --silent-install --install-dir $dir
          $oldInstallExit=$LASTEXITCODE
          if ($oldInstallExit -ne 0) { throw "v0.11 install failed: $oldInstallExit" }
          $exe=Join-Path $dir 'Trace.exe'
          if (!(Test-Path $exe)) { throw 'v0.11 Trace.exe missing.' }
          $before=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()

          $sentinel=Join-Path $dir 'upgrade-research-sentinel.txt'
          'research data must survive upgrade' | Set-Content $sentinel

          $stdout=Join-Path $env:RUNNER_TEMP 'closed-update-stdout.txt'
          $stderr=Join-Path $env:RUNNER_TEMP 'closed-update-stderr.txt'
          $p=Start-Process -FilePath $new -ArgumentList @('--silent-install','--install-dir',$dir) -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $exit=$p.ExitCode
          $after=if(Test-Path $exe){(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()}else{'missing'}
          $out=if(Test-Path $stdout){(Get-Content $stdout -Raw).Trim()}else{''}
          $err=if(Test-Path $stderr){(Get-Content $stderr -Raw).Trim()}else{''}
          $changed=$after -ne $before
          $matchesRef=$after -eq $env:TRACE_V012_REFERENCE_HASH
          $sentinelSurvived=Test-Path $sentinel

          @"
          scenario=closed
          installer_exit=$exit
          old_hash=$before
          hash_after_attempt=$after
          clean_v012_reference_hash=$env:TRACE_V012_REFERENCE_HASH
          executable_changed=$changed
          matches_clean_v012_reference=$matchesRef
          sentinel_survived=$sentinelSurvived
          stdout=$out
          stderr=$err
          "@ | Set-Content closed-upgrade-result.txt

      - name: Scenario B - running-app upgrade evidence
        shell: pwsh
        run: |
          $old=(Resolve-Path 'artifacts/v011/release/TraceSetup.exe').Path
          $new=(Resolve-Path 'artifacts/v012/release/TraceSetup.exe').Path
          $dir=Join-Path $env:RUNNER_TEMP 'TraceUpgradeRunning'
          if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }

          & $old --silent-install --install-dir $dir
          if ($LASTEXITCODE -ne 0) { throw "v0.11 install failed: $LASTEXITCODE" }
          $exe=Join-Path $dir 'Trace.exe'
          $before=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $sentinel=Join-Path $dir 'running-upgrade-research-sentinel.txt'
          'research data must survive running-app update attempt' | Set-Content $sentinel

          $trace=Start-Process -FilePath $exe -WorkingDirectory $dir -PassThru
          Start-Sleep -Seconds 6
          if ($trace.HasExited) { throw "v0.11 Trace exited before reproduction, code $($trace.ExitCode)." }

          $stdout=Join-Path $env:RUNNER_TEMP 'running-update-stdout.txt'
          $stderr=Join-Path $env:RUNNER_TEMP 'running-update-stderr.txt'
          $p=Start-Process -FilePath $new -ArgumentList @('--silent-install','--install-dir',$dir) -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $exit=$p.ExitCode
          $afterRunning=if(Test-Path $exe){(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()}else{'missing'}
          $out=if(Test-Path $stdout){(Get-Content $stdout -Raw).Trim()}else{''}
          $err=if(Test-Path $stderr){(Get-Content $stderr -Raw).Trim()}else{''}
          $traceStillRunning=!$trace.HasExited
          $sentinelAfterAttempt=Test-Path $sentinel

          if (!$trace.HasExited) { Stop-Process -Id $trace.Id -Force }
          Start-Sleep -Seconds 2

          $retryStdout=Join-Path $env:RUNNER_TEMP 'retry-update-stdout.txt'
          $retryStderr=Join-Path $env:RUNNER_TEMP 'retry-update-stderr.txt'
          $retry=Start-Process -FilePath $new -ArgumentList @('--silent-install','--install-dir',$dir) -Wait -PassThru -RedirectStandardOutput $retryStdout -RedirectStandardError $retryStderr
          $retryExit=$retry.ExitCode
          $afterClose=if(Test-Path $exe){(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()}else{'missing'}
          $retryOut=if(Test-Path $retryStdout){(Get-Content $retryStdout -Raw).Trim()}else{''}
          $retryErr=if(Test-Path $retryStderr){(Get-Content $retryStderr -Raw).Trim()}else{''}

          @"
          scenario=running
          installer_exit_while_running=$exit
          old_hash=$before
          hash_after_running_attempt=$afterRunning
          clean_v012_reference_hash=$env:TRACE_V012_REFERENCE_HASH
          matches_clean_v012_while_running=$($afterRunning -eq $env:TRACE_V012_REFERENCE_HASH)
          trace_still_running_after_attempt=$traceStillRunning
          sentinel_survived_running_attempt=$sentinelAfterAttempt
          stdout_while_running=$out
          stderr_while_running=$err
          retry_exit_after_close=$retryExit
          final_hash_after_close=$afterClose
          matches_clean_v012_after_close=$($afterClose -eq $env:TRACE_V012_REFERENCE_HASH)
          sentinel_survived_after_retry=$(Test-Path $sentinel)
          retry_stdout=$retryOut
          retry_stderr=$retryErr
          "@ | Set-Content running-upgrade-result.txt

      - name: Collect setup logs
        if: always()
        shell: pwsh
        run: |
          $log=Join-Path $env:LOCALAPPDATA 'Trace/Installer/TraceSetup.log'
          if (Test-Path $log) { Copy-Item $log TraceSetup.log -Force }

      - name: Summarize diagnosis
        if: always()
        shell: pwsh
        run: |
          @"
          Trace v0.12.1 upgrade reproduction summary
          run_id=${{ github.run_id }}
          run_number=${{ github.run_number }}
          "@ | Set-Content DIAGNOSIS.txt
          foreach($f in @('v012-reference-result.txt','closed-upgrade-result.txt','running-upgrade-result.txt')){
            if(Test-Path $f){Add-Content DIAGNOSIS.txt "`n--- $f ---";Get-Content $f | Add-Content DIAGNOSIS.txt}
          }
          Get-Content DIAGNOSIS.txt

      - name: Upload reproduction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Trace-v0.12.1-Upgrade-Reproduction
          if-no-files-found: error
          retention-days: 14
          path: |
            v012-reference-result.txt
            closed-upgrade-result.txt
            running-upgrade-result.txt
            DIAGNOSIS.txt
            TraceSetup.log

      - name: Publish reproduction result
        if: always()
        shell: pwsh
        working-directory: control
        run: |
          $status=@"
          run_id=${{ github.run_id }}
          run_number=${{ github.run_number }}
          result=${{ job.status }}
          workflow=Trace v0.12.1 upgrade reproduction
          evidence=clean_reference+closed_upgrade+running_upgrade+retry_after_close
          "@
          git config user.name 'trace-build-bot'
          git config user.email 'actions@users.noreply.github.com'
          git reset --hard HEAD
          git pull --rebase origin trace-v0121
          $status | Set-Content build-status/v0121-upgrade-repro.txt
          git add build-status/v0121-upgrade-repro.txt
          if (git status --porcelain) {
            git commit -m 'ci: record v0.12.1 upgrade repro result [skip ci]'
            git push origin HEAD:trace-v0121
          }
