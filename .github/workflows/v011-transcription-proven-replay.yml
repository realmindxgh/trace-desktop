name: Trace v0.11 transcription proven Windows replay

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/v011-transcription-proven-replay.yml'

permissions:
  contents: write

concurrency:
  group: trace-v011-transcription-proven-replay
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Checkout control branch
        uses: actions/checkout@v4
        with:
          path: control

      - name: Publish isolated replay run ID
        shell: pwsh
        working-directory: control
        continue-on-error: true
        run: |
          $path="build-status/runs/v011-transcription-${{ github.run_id }}.txt"
          New-Item -ItemType Directory -Force -Path (Split-Path $path) | Out-Null
          @"
          run_id=${{ github.run_id }}
          run_number=${{ github.run_number }}
          source_sha=eebc47e418003811a0cb27e1b684601a5c77bdcf
          trigger_sha=${{ github.sha }}
          transcription_overlay_sha256=7e8ea74aec6da10154ae9dc7cabe4b252c20ba1432da0ad096496876c02d9b3e
          result=running
          workflow=Trace v0.11 transcription proven Windows replay
          "@ | Set-Content $path
          git config user.name 'trace-build-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add $path
          git commit -m 'ci: record isolated transcription replay [skip ci]'
          if ($LASTEXITCODE -eq 0) {
            for ($i=0; $i -lt 5; $i++) {
              git pull --rebase origin main
              if ($LASTEXITCODE -eq 0) {
                git push origin HEAD:main
                if ($LASTEXITCODE -eq 0) { break }
              }
              Start-Sleep -Seconds 2
            }
          }
          git rebase --abort 2>$null
          exit 0

      - name: Checkout proven transcription source
        uses: actions/checkout@v4
        with:
          ref: eebc47e418003811a0cb27e1b684601a5c77bdcf
          path: source

      - name: Inject corrected transcription overlay into proven source
        shell: pwsh
        run: |
          Copy-Item control/bootstrap/v011transcribe/part00 source/bootstrap/v011transcribe/part00 -Force
          Copy-Item control/bootstrap/v011transcribe/part01 source/bootstrap/v011transcribe/part01 -Force
          $wf='source/.github/workflows/v011-transcription-check.yml'
          $text=Get-Content $wf -Raw
          $text=$text.Replace('17960','18928')
          $text=$text.Replace('8ae71006df954e47040b79fda535b6212bc2949ce4efa7613ab90bbd0204515a','7e8ea74aec6da10154ae9dc7cabe4b252c20ba1432da0ad096496876c02d9b3e')
          Set-Content $wf $text
          $parts=Get-ChildItem source/bootstrap/v011transcribe/part* | Sort-Object Name
          if ($parts.Count -ne 2) { throw 'Corrected transcription overlay must contain exactly two parts.' }
          $b64=($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          if ($b64.Length -ne 18928) { throw "Corrected transcription overlay length mismatch: $($b64.Length)" }
          $compressed=Join-Path $env:RUNNER_TEMP 'trace-v011transcribe-corrected.patch.xz'
          [IO.File]::WriteAllBytes($compressed,[Convert]::FromBase64String($b64))
          $hash=(Get-FileHash $compressed -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '7e8ea74aec6da10154ae9dc7cabe4b252c20ba1432da0ad096496876c02d9b3e') { throw "Corrected transcription overlay SHA-256 mismatch: $hash" }

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Replay proven reconstruction and contracts with native Windows bindings
        shell: pwsh
        working-directory: source
        run: |
          python -m pip install pyyaml
          if ($LASTEXITCODE -ne 0) { throw 'Could not install PyYAML.' }
          @'
          import pathlib, subprocess, tempfile, yaml
          root = pathlib.Path.cwd()
          workflow = yaml.safe_load((root / '.github/workflows/v011-transcription-check.yml').read_text(encoding='utf-8'))
          steps = workflow['jobs']['check']['steps']
          wanted = [
              'Reconstruct verified Trace base source',
              'Apply verified v0.10 overlay',
              'Apply verified v0.11 imports and display overlay',
              'Apply verified v0.11 usability overlay',
              'Apply verified v0.11 local transcription overlay',
              'Prepare Windows assets',
              'Frontend and research workflow contracts',
              'Rust compile and transcription unit tests',
          ]
          by_name = {s.get('name'): s for s in steps}
          for name in wanted:
              step = by_name[name]
              cwd = root / step.get('working-directory', '.')
              with tempfile.NamedTemporaryFile('w', suffix='.ps1', encoding='utf-8', delete=False) as f:
                  f.write("$ErrorActionPreference = 'Stop'\n")
                  f.write(step['run'])
                  script = f.name
              print(f'REPLAY STEP: {name}', flush=True)
              subprocess.run(['pwsh','-NoProfile','-File',script], cwd=cwd, check=True)
          '@ | Set-Content replay_proven.py
          python replay_proven.py
          if ($LASTEXITCODE -ne 0) { throw 'Proven transcription replay failed.' }

      - name: Upload green reconstructed source
        uses: actions/upload-artifact@v4
        with:
          name: Trace-v0.11-Transcription-Proven-Windows-Green-Source
          if-no-files-found: error
          retention-days: 14
          path: |
            source/work/package.json
            source/work/src/**
            source/work/database/**
            source/work/src-tauri/Cargo.toml
            source/work/src-tauri/tauri.conf.json
            source/work/src-tauri/src/**
            source/work/setup-shell/package.json
            source/work/setup-shell/src/**
            source/work/setup-shell/src-tauri/Cargo.toml
            source/work/setup-shell/src-tauri/tauri.conf.json
            source/work/setup-shell/src-tauri/src/**
            source/work/tests/**

      - name: Record verification result in job summary
        if: always()
        shell: pwsh
        run: |
          @"
          Trace v0.11 transcription proven Windows replay
          Run: ${{ github.run_id }}
          Overlay: 7e8ea74aec6da10154ae9dc7cabe4b252c20ba1432da0ad096496876c02d9b3e
          Result: ${{ job.status }}
          Verification: proven reconstruction + all v0.11 contracts + native Whisper bindings + functional WAV decode + Rust check/tests + source artifact
          "@ | Add-Content $env:GITHUB_STEP_SUMMARY
