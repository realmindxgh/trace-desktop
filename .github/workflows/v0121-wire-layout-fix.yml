name: Trace v0.12.1 wire browser geometry fix

on:
  push:
    branches: [trace-v0121]
    paths:
      - '.github/workflows/v0121-wire-layout-fix.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: trace-v0121
      - name: Wire geometry patch into exact reconstruction workflows
        shell: python
        run: |
          from pathlib import Path
          for name in [
              '.github/workflows/v0121-full-checklist-gate.yml',
              '.github/workflows/v0121-browser-debug.yml',
          ]:
              p=Path(name)
              s=p.read_text()
              if 'v0121_layout_fix.py' in s:
                  continue
              needle="""          python scripts/finalize_full_checklist.py
          if ($LASTEXITCODE -ne 0) { Pop-Location; throw 'Final full-checklist transform failed.' }
          Pop-Location
"""
              if name.endswith('browser-debug.yml'):
                  needle="""          python scripts/finalize_full_checklist.py
          if ($LASTEXITCODE -ne 0) { throw 'Finalizer transform failed.' }
          Pop-Location
"""
                  repl="""          python scripts/finalize_full_checklist.py
          if ($LASTEXITCODE -ne 0) { throw 'Finalizer transform failed.' }
          python ../control/ci/v0121_layout_fix.py
          if ($LASTEXITCODE -ne 0) { throw 'Browser geometry transform failed.' }
          Pop-Location
"""
              else:
                  repl="""          python scripts/finalize_full_checklist.py
          if ($LASTEXITCODE -ne 0) { Pop-Location; throw 'Final full-checklist transform failed.' }
          python ../control/ci/v0121_layout_fix.py
          if ($LASTEXITCODE -ne 0) { Pop-Location; throw 'Browser geometry transform failed.' }
          Pop-Location
"""
              if needle not in s:
                  raise SystemExit(f'Could not find reconstruction hook in {name}')
              p.write_text(s.replace(needle,repl,1))
      - name: Commit wiring
        shell: bash
        run: |
          git config user.name trace-build-bot
          git config user.email actions@users.noreply.github.com
          git add .github/workflows/v0121-full-checklist-gate.yml .github/workflows/v0121-browser-debug.yml
          git commit -m 'ci: apply v0.12.1 browser geometry patch in gates'
          git pull --rebase origin trace-v0121
          git push origin HEAD:trace-v0121
