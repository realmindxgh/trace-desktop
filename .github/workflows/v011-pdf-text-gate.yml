name: Trace v0.11 PDF text Windows gate

on:
  push:
    branches:
      - trace-v011-pdf-text-gate
    paths:
      - '.github/workflows/v011-pdf-text-gate.yml'
      - 'bootstrap/v011pdf/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/v011-pdf-text-gate.yml'
      - 'bootstrap/v011pdf/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trace-v011-pdf-text-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Checkout PDF gate control branch
        uses: actions/checkout@v4
        with:
          path: control

      - name: Publish isolated PDF gate run ID
        shell: pwsh
        working-directory: control
        run: |
          $path='build-status/v011-pdf-text-gate.txt'
          New-Item -ItemType Directory -Force -Path (Split-Path $path) | Out-Null
          @"
          run_id=${{ github.run_id }}
          run_number=${{ github.run_number }}
          trigger_sha=${{ github.sha }}
          overlay_xz_sha256=6e50b81fac3c4822f3ec6e452e5e8bbfd7f0a8628b0f99d7dbb7502c3ccf2128
          overlay_patch_sha256=8d1ae4be2c70243f36a815a020ff056701944d5ac2e0fe088403fa5d2b94fbb0
          result=running
          workflow=Trace v0.11 PDF text Windows gate
          "@ | Set-Content $path
          git config user.name 'trace-build-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add $path
          git commit -m 'ci: record isolated PDF text gate run [skip ci]'
          if ($LASTEXITCODE -ne 0) { throw 'Could not commit the isolated PDF gate run ID.' }
          git pull --rebase origin trace-v011-pdf-text-gate
          if ($LASTEXITCODE -ne 0) { throw 'Could not rebase the isolated PDF gate status.' }
          git push origin HEAD:trace-v011-pdf-text-gate
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the isolated PDF gate run ID.' }

      - name: Checkout proven transcription source
        uses: actions/checkout@v4
        with:
          ref: eebc47e418003811a0cb27e1b684601a5c77bdcf
          path: source

      - name: Inject corrected transcription overlay into proven source
        shell: pwsh
        run: |
          Copy-Item control/bootstrap/v011transcribe/part00 source/bootstrap/v011transcribe/part00 -Force
          Copy-Item control/bootstrap/v011transcribe/part01 source/bootstrap/v011transcribe/part01 -Force
          $wf='source/.github/workflows/v011-transcription-check.yml'
          $text=Get-Content $wf -Raw
          $text=$text.Replace('17960','18928')
          $text=$text.Replace('8ae71006df954e47040b79fda535b6212bc2949ce4efa7613ab90bbd0204515a','7e8ea74aec6da10154ae9dc7cabe4b252c20ba1432da0ad096496876c02d9b3e')
          Set-Content $wf $text

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Reconstruct transcription-green Trace v0.11 source
        shell: pwsh
        working-directory: source
        run: |
          python -m pip install pyyaml
          if ($LASTEXITCODE -ne 0) { throw 'Could not install PyYAML.' }
          @'
          import pathlib, subprocess, tempfile, yaml
          root = pathlib.Path.cwd()
          workflow = yaml.safe_load((root / '.github/workflows/v011-transcription-check.yml').read_text(encoding='utf-8'))
          steps = workflow['jobs']['check']['steps']
          wanted = [
              'Reconstruct verified Trace base source',
              'Apply verified v0.10 overlay',
              'Apply verified v0.11 imports and display overlay',
              'Apply verified v0.11 usability overlay',
              'Apply verified v0.11 local transcription overlay',
              'Prepare Windows assets',
              'Frontend and research workflow contracts',
              'Rust compile and transcription unit tests',
          ]
          by_name = {s.get('name'): s for s in steps}
          for name in wanted:
              step = by_name[name]
              cwd = root / step.get('working-directory', '.')
              with tempfile.NamedTemporaryFile('w', suffix='.ps1', encoding='utf-8', delete=False) as f:
                  f.write("$ErrorActionPreference = 'Stop'\n")
                  f.write(step['run'])
                  script = f.name
              print(f'REPLAY STEP: {name}', flush=True)
              subprocess.run(['pwsh','-NoProfile','-File',script], cwd=cwd, check=True)
          '@ | Set-Content replay_transcription_green.py
          python replay_transcription_green.py
          if ($LASTEXITCODE -ne 0) { throw 'Could not reconstruct the proven transcription-green source.' }

      - name: Apply PDF text-analysis overlay
        shell: pwsh
        working-directory: source
        run: |
          $parts=Get-ChildItem ../control/bootstrap/v011pdf/part* | Sort-Object Name
          if ($parts.Count -ne 1) { throw "Incomplete PDF overlay. Expected 1 part, found $($parts.Count)." }
          $b64=($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          if ($b64.Length -ne 8556) { throw "PDF overlay base64 length mismatch: $($b64.Length)" }
          $compressed=Join-Path $env:RUNNER_TEMP 'trace-v011pdf.patch.xz'
          [IO.File]::WriteAllBytes($compressed,[Convert]::FromBase64String($b64))
          $hash=(Get-FileHash $compressed -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '6e50b81fac3c4822f3ec6e452e5e8bbfd7f0a8628b0f99d7dbb7502c3ccf2128') { throw "PDF overlay SHA-256 mismatch: $hash" }
          $patch=Join-Path $env:RUNNER_TEMP 'trace-v011pdf.patch'
          python -c "import lzma,pathlib; pathlib.Path(r'$patch').write_bytes(lzma.decompress(pathlib.Path(r'$compressed').read_bytes()))"
          if ($LASTEXITCODE -ne 0) { throw 'Could not decompress PDF overlay.' }
          $patchHash=(Get-FileHash $patch -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($patchHash -ne '8d1ae4be2c70243f36a815a020ff056701944d5ac2e0fe088403fa5d2b94fbb0') { throw "PDF patch SHA-256 mismatch: $patchHash" }
          git apply --check --directory=work $patch
          if ($LASTEXITCODE -ne 0) { throw 'PDF overlay preflight failed.' }
          git apply --directory=work $patch
          if ($LASTEXITCODE -ne 0) { throw 'PDF overlay application failed.' }

      - name: PDF, frontend and regression contracts
        shell: pwsh
        working-directory: source/work
        run: |
          node --check src/app.js
          if ($LASTEXITCODE -ne 0) { throw 'JavaScript syntax check failed after PDF overlay.' }
          python tests/v11_pdf_text.py
          if ($LASTEXITCODE -ne 0) { throw 'Trace v0.11 PDF text-analysis contract failed.' }
          python tests/v11_imports_display.py
          if ($LASTEXITCODE -ne 0) { throw 'Trace v0.11 import/display regression contract failed.' }
          python tests/v11_usability.py
          if ($LASTEXITCODE -ne 0) { throw 'Trace v0.11 usability regression contract failed.' }
          python tests/v11_transcription.py
          if ($LASTEXITCODE -ne 0) { throw 'Trace v0.11 transcription regression contract failed.' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Trace frontend build failed after PDF overlay.' }

      - name: Native Windows compile and real PDF extraction test
        shell: pwsh
        working-directory: source/work
        run: |
          cargo check --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Trace PDF Rust compile check failed.' }
          cargo test --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Trace native Rust tests failed.' }

      - name: Upload PDF-text green source
        uses: actions/upload-artifact@v4
        with:
          name: Trace-v0.11-PDF-Text-Windows-Green-Source
          if-no-files-found: error
          retention-days: 14
          path: |
            source/work/package.json
            source/work/src/**
            source/work/database/**
            source/work/src-tauri/Cargo.toml
            source/work/src-tauri/tauri.conf.json
            source/work/src-tauri/src/**
            source/work/setup-shell/package.json
            source/work/setup-shell/src/**
            source/work/setup-shell/src-tauri/Cargo.toml
            source/work/setup-shell/src-tauri/tauri.conf.json
            source/work/setup-shell/src-tauri/src/**
            source/work/tests/**

      - name: Publish isolated PDF gate result
        if: always()
        shell: pwsh
        working-directory: control
        run: |
          $status=@"
          run_id=${{ github.run_id }}
          run_number=${{ github.run_number }}
          trigger_sha=${{ github.sha }}
          overlay_xz_sha256=6e50b81fac3c4822f3ec6e452e5e8bbfd7f0a8628b0f99d7dbb7502c3ccf2128
          overlay_patch_sha256=8d1ae4be2c70243f36a815a020ff056701944d5ac2e0fe088403fa5d2b94fbb0
          result=${{ job.status }}
          workflow=Trace v0.11 PDF text Windows gate
          verification=transcription_green_replay+pdf_overlay_hash+frontend_contracts+pdf_contract+v011_regressions+rust_check+rust_tests+artifact_upload
          "@
          git config user.name 'trace-build-bot'
          git config user.email 'actions@users.noreply.github.com'
          git reset --hard HEAD
          git pull --rebase origin trace-v011-pdf-text-gate
          if ($LASTEXITCODE -ne 0) { throw 'Could not rebase before publishing the isolated PDF gate result.' }
          $status | Set-Content build-status/v011-pdf-text-gate.txt
          git add build-status/v011-pdf-text-gate.txt
          if (git status --porcelain) {
            git commit -m 'ci: record isolated PDF text gate result [skip ci]'
            if ($LASTEXITCODE -ne 0) { throw 'Could not commit the isolated PDF gate result.' }
            git push origin HEAD:trace-v011-pdf-text-gate
            if ($LASTEXITCODE -ne 0) { throw 'Could not publish the isolated PDF gate result.' }
          }
