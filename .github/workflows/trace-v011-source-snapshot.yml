name: Trace UX Foundation Windows gate

on:
  workflow_dispatch:
  push:
    branches:
      - trace-ux-foundation
    paths:
      - '.github/workflows/trace-v011-source-snapshot.yml'
      - 'ci/ux_foundation_gate_v5.ps1'
      - 'ci/phase3_browser_gate.ps1'
      - 'ci/phase3-ci.html'
      - 'ci/phase4_browser_gate.ps1'
      - 'ci/phase4-ci.html'
      - 'bootstrap/v011ux2/**'
      - 'bootstrap/v011ux3/**'
      - 'bootstrap/v011ux4/**'
      - 'bootstrap/v011ux5/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/trace-v011-source-snapshot.yml'
      - 'ci/ux_foundation_gate_v5.ps1'
      - 'ci/phase3_browser_gate.ps1'
      - 'ci/phase3-ci.html'
      - 'ci/phase4_browser_gate.ps1'
      - 'ci/phase4-ci.html'
      - 'bootstrap/v011ux2/**'
      - 'bootstrap/v011ux3/**'
      - 'bootstrap/v011ux4/**'
      - 'bootstrap/v011ux5/**'

permissions:
  contents: write

concurrency:
  group: trace-ux-foundation-known-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runner-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm hosted runner starts
        run: echo "GitHub-hosted runner is available for Trace UX verification."

  verify:
    needs: runner-preflight
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Checkout UX candidate
        uses: actions/checkout@v4
        with:
          ref: trace-ux-foundation

      - name: Checkout proven v0.11 checkpoint
        uses: actions/checkout@v4
        with:
          ref: eebc47e418003811a0cb27e1b684601a5c77bdcf
          path: source

      - name: Publish UX run ID
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build-status | Out-Null
          @"
          run_id=${{ github.run_id }}
          run_number=${{ github.run_number }}
          trigger_sha=${{ github.sha }}
          result=running
          workflow=Trace UX Foundation Windows gate
          "@ | Set-Content build-status/ux-foundation.txt
          git config user.name 'trace-build-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add build-status/ux-foundation.txt
          git commit -m 'ci: record UX foundation run [skip ci]'
          if ($LASTEXITCODE -eq 0) { git push origin HEAD:trace-ux-foundation }

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Reconstruct, render, build, install and launch UX candidate
        shell: pwsh
        run: ./ci/ux_foundation_gate_v5.ps1

      - name: Upload UX Foundation Windows candidate
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Trace-UX-Foundation-Windows-Candidate
          if-no-files-found: error
          retention-days: 14
          path: |
            source/work/ux-artifacts/**
            source/work/src-tauri/target/release/Trace.exe
            source/work/src-tauri/target/release/bundle/nsis/*.exe
            source/work/src-tauri/target/release/bundle/msi/*.msi

      - name: Publish UX result
        if: always() && github.event_name != 'pull_request'
        shell: pwsh
        run: |
          git config user.name 'trace-build-bot'
          git config user.email 'actions@users.noreply.github.com'
          git reset --hard HEAD
          git pull --rebase origin trace-ux-foundation
          @"
          run_id=${{ github.run_id }}
          run_number=${{ github.run_number }}
          trigger_sha=${{ github.sha }}
          result=${{ job.status }}
          workflow=Trace UX Foundation Windows gate
          verification=exact_v011_reconstruction+corrected_pdf+ux_phase1_hash+ux_phase2_hash+ux_phase3_hash+ux_phase4_hash+v011_regressions+ux_contract_82+phase3_logic+phase4_logic+first_launch_visual_smoke+phase3_edge_visual+phase4_edge_visual+rust_check+rust_tests+windows_bundle+installed_launch+native_uninstall+research_data_preservation
          "@ | Set-Content build-status/ux-foundation.txt
          git add build-status/ux-foundation.txt
          if (git status --porcelain) {
            git commit -m 'ci: record UX foundation result [skip ci]'
            git push origin HEAD:trace-ux-foundation
          }
